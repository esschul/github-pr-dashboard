<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GitHub PR Dashboard</title>
    <link rel="stylesheet" href="./styles.css">
</head>
<body>
    <div class="app-shell">
        <aside class="sidebar">
            <div>
                <div class="sidebar-header">
                    <div class="sidebar-title">
                        <p class="eyebrow">GitHub CLI</p>
                        <h1>PR Dashboard</h1>
                    </div>
                    <button id="sidebarToggle" class="sidebar-toggle" type="button" aria-label="Collapse menu" title="Collapse menu">
                        <span id="sidebarToggleIcon" aria-hidden="true">‹</span>
                    </button>
                </div>
                <p id="teamLabel" class="team-label"></p>
            </div>

            <nav class="nav" aria-label="Dashboard views">
                <button class="nav-item is-active" type="button" data-view="pull-requests">
                    <span class="nav-label">Pull requests</span>
                    <span id="pullRequestsCount" class="nav-count">0</span>
                </button>
                <button class="nav-item" type="button" data-view="merged-today">
                    <span class="nav-label">Merged today</span>
                    <span id="mergedTodayCount" class="nav-count">0</span>
                </button>
                <button class="nav-item" type="button" data-view="dependabot">
                    <span class="nav-label">Dependabot</span>
                    <span id="dependabotCount" class="nav-count">0</span>
                </button>
                <button class="nav-item" type="button" data-view="settings">
                    <span class="nav-label">Settings</span>
                </button>
            </nav>

            <div class="sidebar-footer">
                <button id="themeButton" class="theme-button" type="button" aria-label="Use dark theme" title="Use dark theme">
                    <span id="themeIcon" aria-hidden="true">☾</span>
                </button>
            </div>
        </aside>

        <main class="content">
            <header class="topbar">
                <div>
                    <p id="viewEyebrow" class="eyebrow">Team queue</p>
                    <h2 id="viewTitle">Pull requests</h2>
                </div>
                <button id="refreshButton" class="primary-button" type="button">Refresh</button>
            </header>

            <section id="statusPanel" class="status-panel" aria-live="polite">
                Loading pull requests...
            </section>

            <section id="errorPanel" class="error-panel hidden" aria-live="polite"></section>

            <section id="pullRequestsView" class="view">
                <div id="pullRequestFilters" class="filter-bar" aria-label="Pull request filters">
                    <button class="filter-chip is-active" type="button" data-filter="all">All <span id="filterCountAll">0</span></button>
                    <button class="filter-chip" type="button" data-filter="approved">Approved <span id="filterCountApproved">0</span></button>
                    <button class="filter-chip" type="button" data-filter="pending">Pending <span id="filterCountPending">0</span></button>
                    <button class="filter-chip" type="button" data-filter="changes-requested">Changes requested <span id="filterCountChangesRequested">0</span></button>
                    <button class="filter-chip" type="button" data-filter="draft">Draft <span id="filterCountDraft">0</span></button>
                    <button class="filter-chip" type="button" data-filter="checks-failing">Checks failing <span id="filterCountChecksFailing">0</span></button>
                    <button class="filter-chip" type="button" data-filter="checks-pending">Checks pending <span id="filterCountChecksPending">0</span></button>
                </div>
                <div id="pullRequestsList" class="pull-request-list"></div>
            </section>

            <section id="mergedTodayView" class="view hidden">
                <div class="merged-sections">
                    <section class="merged-section">
                        <div id="mergedTodayList" class="pull-request-list"></div>
                    </section>

                    <section class="merged-section">
                        <div class="section-heading">
                            <div>
                                <p class="eyebrow">Merged today</p>
                                <h3>Dependabot</h3>
                            </div>
                        </div>
                        <div id="mergedTodayDependabotList" class="pull-request-list"></div>
                    </section>
                </div>
            </section>

            <section id="dependabotView" class="view hidden">
                <div id="dependabotFilters" class="filter-bar" aria-label="Dependabot pull request filters">
                    <button class="filter-chip is-active" type="button" data-filter="all">All <span id="dependabotFilterCountAll">0</span></button>
                    <button class="filter-chip" type="button" data-filter="checks-failing">Checks failing <span id="dependabotFilterCountChecksFailing">0</span></button>
                </div>
                <div id="dependabotList" class="pull-request-list"></div>
            </section>

            <section id="settingsView" class="view hidden">
                <form id="settingsForm" class="panel settings-form">
                    <div>
                        <p class="eyebrow">Team repositories</p>
                        <h3>Configuration</h3>
                        <p class="form-help">Repositories are selected by organization and GitHub repository topic.</p>
                    </div>

                    <label>
                        <span>GitHub organization</span>
                        <input id="organizationInput" name="organization" type="text" required autocomplete="off">
                    </label>

                    <label>
                        <span>Repository topic</span>
                        <input id="topicInput" name="topic" type="text" required autocomplete="off">
                    </label>

                    <div class="settings-actions">
                        <button class="primary-button" type="submit">Save and refresh</button>
                    </div>
                </form>
            </section>
        </main>
    </div>

    <script src="./renderer.js"></script>
</body>
</html>
